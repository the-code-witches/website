<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>book a session — the code witches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="assets/logo.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="assets/logo-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      body {
        overflow: hidden;
      }
      body::before,
      body::after {
        display: none;
      }
      .book__container {
        position: fixed;
        top: var(--header-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--header-height));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .book__frame {
        width: 50vw;
        height: 90%;
        border: none;
      }

      @media (max-width: 992px) {
        .book__frame {
          width: 100%;
          height: 100%;
        }
      }
      .nav__cta--book {
        color: var(--primary);
      }
      .nav__cta--book:hover {
        color: var(--text);
      }
    </style>
  </head>

  <body class="neutral-box">
    <header class="site-header">
      <nav class="nav">
        <div class="nav__left">
          <a class="nav__logo" href="index.html">
            <img src="assets/logo.svg" alt="Home" />
          </a>
          <a class="nav__link" href="index.html#about">about</a>
          <a class="nav__link" href="index.html#services">services</a>
          <a class="nav__link" href="index.html#clients">projects</a>
          <a class="nav__link" href="index.html#contact">contact</a>
        </div>
        <div class="nav__right">
          <a class="nav__cta nav__cta--book" href="index.html">book free session</a>
        </div>
      </nav>
    </header>
    <div class="book__container">
      <iframe
        class="book__frame"
        src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0guq06Owsw0Y6NXpFZsFTVvfDoWqTi9cEKwSyCyArnnXoICXHcX6kOCikamSvCMGlZUKBzsnWT?gv=true"
        title="Book a session with The Code Witches"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
