<!doctype html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Lexend:wght@100;200;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #fff7e5;
      font-family: 'Lexend', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 60px 80px;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 28px;
    }

    .name {
      font-family: 'Lexend', sans-serif;
      font-weight: 200;
      font-size: 72px;
      color: #211d2b;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .tagline {
      font-family: 'Lexend', sans-serif;
      font-weight: 400;
      font-size: 24px;
      color: #6b6480;
      margin-bottom: 28px;
    }

    .sep {
      width: 48px;
      height: 1.5px;
      background: #5a4fcf;
      opacity: 0.4;
      margin-bottom: 28px;
    }

    .punchline {
      font-family: 'Lexend', sans-serif;
      font-weight: 400;
      font-size: 26px;
      color: #211d2b;
      margin-bottom: 20px;
    }

    .audience {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #9e9aac;
      margin-bottom: 36px;
    }

    .domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #5a4fcf;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0,-5.112)">
        <path d="M 50,10 70,50 H 30 Z" fill="#5a4fcf"/>
        <rect x="20" y="60" width="60" height="8" rx="1" fill="#5a4fcf"/>
        <text x="50" y="92.5" dominant-baseline="middle" text-anchor="middle"
              font-size="28" font-family="'Lexend', sans-serif" fill="#211d2b">{ }</text>
      </g>
    </svg>

    <div class="name">the code witches</div>
    <div class="tagline">software engineering &amp; technical partnership</div>
    <div class="sep"></div>
    <div class="punchline">we hold the complexity, so you can lead</div>
    <div class="audience">// smes &nbsp;·&nbsp; technical teams &nbsp;·&nbsp; founders</div>
    <div class="domain">thecodewitches.de</div>
  </div>
</body>
</html>
